[project]
name = "sila-api"
version = "0.1.0"
description = "Sila platform API — sovereign AI agent marketplace"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    # Pin starlette explicitly to dodge PYSEC-2026-161 in 1.0.0 and
    # CVE-2026-54282 / CVE-2026-54283 (fixed in 1.3.0 / 1.3.1) that the
    # version fastapi pulls in transitively still carries. Drop the pin once
    # fastapi's own range moves past it.
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.14.2",  # GHSA-4xgf-cpjx-pc3j fixed in 2.14.2
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28",
    "PyYAML>=6.0",
    # >=0.0.31 clears CVE-2026-53538 / 53539 / 53540 (multipart DoS).
    "python-multipart>=0.0.31",
    "argon2-cffi>=23.1",
    "python-jose[cryptography]>=3.3",
    "structlog>=24.4",
    "meilisearch>=0.31",
    "better-profanity>=0.7",
    # Phase 4 — Knowledge Base & RAG
    # >=6.12.0 clears CVE-2026-48155 / CVE-2026-48156 (DoS via crafted PDF).
    "pypdf>=6.13.3",  # GHSA-jm82-fx9c-mx94 fixed in 6.13.3
    "python-docx>=1.1",
    "python-magic>=0.4.27",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "beautifulsoup4>=4.12",
    "pytesseract>=0.3.13",
    "lxml>=5.3",
    # Phase 5 — Tools, MCP & integrations
    "jsonschema>=4.23",
    # Phase B multi-tenancy — Fernet at-rest encryption for stored n8n passwords.
    # >=48.0.1 clears GHSA-537c-gmf6-5ccf.
    "cryptography>=48.0.1",
    "langgraph>=1.2.6",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.2",
    "duckdb>=1.5.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.35",
    "httpx>=0.28",
    "mypy>=1.13",
    "ruff>=0.8",
    "sqlalchemy[mypy]>=2.0",
    "types-python-jose>=3.3",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sila"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Alembic migrations have long SA column definitions — readability > line limit
"alembic/*" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
# Test files use untyped fixtures + monkeypatch heavily — strict mode there
# costs more than it earns. Source code stays under strict.
exclude = ["^tests/"]

[[tool.mypy.overrides]]
module = [
  "better_profanity.*",
  "meilisearch.*",
  "magic.*",
  "pypdf.*",
  "docx.*",
  "bs4.*",
  "presidio_analyzer.*",
  "presidio_anonymizer.*",
  "pytesseract.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    # Drives real PowerPoint over COM from Windows. Skips everywhere else, so
    # CI is unaffected; run locally with `pytest -m powerpoint`.
    "powerpoint: needs Windows PowerPoint (skipped without powershell.exe)",
]
